<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - Warrior Gym</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- ICONOS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
    <!-- ========================= -->
    <!-- LOGIN -->
    <!-- ========================= -->

    <section class="login-section">
        <div class="login-overlay"></div>

        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-xl-4 col-lg-5 col-md-7">
                    <div class="login-card shadow-lg">
                        <div class="text-center mb-4">
                            <div class="brand-badge mb-3">
                                <i class="bi bi-shield-lock-fill"></i>
                            </div>
                            <h1 class="login-title">WARRIOR GYM</h1>
                            <p class="login-subtitle">
                                Controla tu entrenamiento, mensajes y progreso desde un solo lugar.
                            </p>
                        </div>

                        <form>
                            <div class="form-floating mb-4 login-field">
                                <input
                                    type="text"
                                    class="form-control"
                                    id="username"
                                    placeholder="Usuario"
                                />
                                <label for="username">
                                    <i class="bi bi-person-fill me-2"></i>Usuario
                                </label>
                            </div>

                            <div class="form-floating mb-4 login-field">
                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="Contraseña"
                                />
                                <label for="password">
                                    <i class="bi bi-lock-fill me-2"></i>Contraseña
                                </label>
                            </div>

                            <button type="submit" class="btn btn-danger w-100 login-btn mb-3">
                                Ingresar al Sistema
                            </button>

                            <div class="text-center login-help">
                                <a href="../index.html">Volver a Warrior Gym</a>
                            </div>
                        </form>

                        <div class="demo-access mt-4 text-center">
                            <h5>Acceso Administrativo</h5>
                            <p>
                                Usuario: <strong>admin</strong>
                            </p>
                            <p>
                                Contraseña: <strong>admin</strong>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
